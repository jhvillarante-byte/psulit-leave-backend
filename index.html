<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Psulit Leave Slip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-ink:#101a30;
    --paper:#F7F3E8;
    --paper-dark:#efe8d6;
    --gold:#C9A227;
    --rust:#B5442E;
    --sage:#12824A;
    --line: rgba(27,42,74,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(27,42,74,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--navy-ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 28px 14px 60px;
  }
  .sheet{
    width:100%;
    max-width:480px;
  }
  .letterhead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 2px solid var(--navy);
    padding-bottom:10px;
    margin-bottom: 4px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .logo{
    width: 38px;
    height: 38px;
    border-radius: 9px;
    display:block;
  }
  .letterhead .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 20px;
    letter-spacing: 0.2px;
    color: var(--navy);
    white-space: nowrap;
  }
  .letterhead .brand span{
    color: var(--sage);
  }
  .letterhead .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--navy);
    opacity:0.6;
    text-transform:uppercase;
    letter-spacing: 1px;
  }
  .form-no{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--navy);
    opacity: 0.55;
    text-align:right;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
  }
  .title-block{
    text-align:center;
    margin-bottom: 26px;
  }
  .title-block h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 28px;
    margin: 0 0 4px;
    color: var(--navy);
  }
  .title-block p{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--navy);
    opacity:0.65;
    margin:0;
    text-transform:uppercase;
    letter-spacing: 1.2px;
  }

  .card{
    background: #fffdf8;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 24px 20px 20px;
    position: relative;
    box-shadow: 0 1px 0 var(--line), 0 14px 30px -18px rgba(27,42,74,0.35);
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top: 16px; bottom: 16px;
    width:1px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 12px);
  }

  .field{
    margin-bottom: 18px;
  }
  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--navy);
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .field .req{ color: var(--rust); }

  .seg{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .seg button{
    flex:1 1 auto;
    min-width: 84px;
    padding: 9px 10px;
    border-radius: 3px;
    border:1px solid var(--line);
    background: transparent;
    font-family:'Inter', sans-serif;
    font-size: 13.5px;
    font-weight:600;
    color: var(--navy);
    cursor:pointer;
    transition: all .15s ease;
  }
  .seg button.active{
    background: var(--navy);
    border-color: var(--navy);
    color: var(--paper);
  }
  .seg.leavetype button.active[data-val="Sick"]{ background: var(--rust); border-color:var(--rust); }
  .seg.leavetype button.active[data-val="Vacation"]{ background: var(--sage); border-color:var(--sage); }
  .seg.leavetype button.active[data-val="Emergency/Other"]{ background: var(--gold); border-color:var(--gold); color:var(--navy-ink); }
  .seg.leavetype button.active[data-val="Change Off"]{ background: #4A6FA5; border-color:#4A6FA5; }
  .seg.leavetype button.active[data-val="Offset Request"]{ background: #7A5C9E; border-color:#7A5C9E; }

  select, input[type=text], input[type=date], textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: #fff;
    color: var(--navy-ink);
    -webkit-appearance:none;
    appearance:none;
  }
  select:focus, input:focus, textarea:focus{
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(27,42,74,0.12);
  }
  textarea{ resize: vertical; min-height: 64px; font-family:'Inter', sans-serif;}

  .row2{ display:flex; gap: 10px; }
  .row2 .field{ flex:1; }

  .days-note{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--navy);
    opacity: 0.6;
    margin-top: 6px;
  }

  .submit-btn{
    width:100%;
    padding: 15px;
    margin-top: 6px;
    border:none;
    border-radius: 3px;
    background: var(--sage);
    color: var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size: 13.5px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor:pointer;
    transition: transform .1s ease, background .15s ease;
  }
  .submit-btn:active{ transform: scale(0.98); }
  .submit-btn:disabled{ opacity:0.55; cursor:not-allowed; }

  .error{
    color: var(--rust);
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px;
    margin-top: 4px;
    display:none;
  }
  .error.show{ display:block; }

  /* Stamp overlay */
  .stamp-wrap{
    position:fixed;
    inset:0;
    background: rgba(16,26,48,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 50;
    padding: 20px;
  }
  .stamp-wrap.show{ display:flex; }
  .stamp-card{
    background: #fffdf8;
    border-radius: 6px;
    padding: 34px 28px;
    text-align:center;
    max-width: 340px;
    width:100%;
    position:relative;
    overflow:hidden;
  }
  .stamp{
    display:inline-block;
    border: 4px solid var(--sage);
    color: var(--sage);
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 6px;
    transform: rotate(-8deg) scale(0.6);
    opacity:0;
    margin-bottom: 16px;
  }
  .stamp.animate{
    animation: stampIn .45s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .stamp.error-stamp{
    border-color: var(--rust);
    color: var(--rust);
  }
  @keyframes stampIn{
    0%{ opacity:0; transform: rotate(-8deg) scale(2); }
    60%{ opacity:1; transform: rotate(-8deg) scale(0.92); }
    100%{ opacity:1; transform: rotate(-8deg) scale(1); }
  }
  .stamp-card p{
    font-family:'Inter', sans-serif;
    font-size: 14px;
    color: var(--navy);
    margin: 0 0 20px;
    line-height:1.5;
  }
  .stamp-card button{
    background: var(--navy);
    color: var(--paper);
    border:none;
    padding: 11px 22px;
    border-radius: 3px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor:pointer;
  }

  .footer-note{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--navy);
    opacity: 0.45;
    margin-top: 18px;
    letter-spacing: 0.5px;
  }
</style>
</head>

          <button type="button" data-val="Vacation">Vacation</button>
          <button type="button" data-val="Emergency/Other">Emergency/Other</button>
          <button type="button" data-val="Change Off">Change Off</button>
          <button type="button" data-val="Offset Request">Offset Request</button>

<script>
  // Backend that posts to Telegram and handles approval replies.
  // Set this to your deployed Render URL after deploying leave-backend/server.js
  // Serverless backend, hosted on this same Netlify site — no CORS needed,
  // and no separate Render domain that Solaire's venue wifi firewall can block.
  const BACKEND_URL = "";

  const EMPLOYEES = {
    Solaire: ["Jazelle Espiritu", "Cristina Mirang", "Irene Maligat", "Angelica Besid"],
    Alphaland: ["Joan Legaspi"]
  };

  const branchSeg = document.getElementById('branchSeg');
  const typeSeg = document.getElementById('typeSeg');
  const employeeSelect = document.getElementById('employeeSelect');
  const employeeOther = document.getElementById('employeeOther');
  const coverSelect = document.getElementById('coverSelect');
  const coverOther = document.getElementById('coverOther');
  const dateFrom = document.getElementById('dateFrom');
  const dateTo = document.getElementById('dateTo');
  const daysNote = document.getElementById('daysNote');
  const reasonEl = document.getElementById('reason');
  const contactEl = document.getElementById('contact');
  const hoursField = document.getElementById('hoursField');
  const hoursEl = document.getElementById('hoursRequested');
  const formError = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  const formNo = document.getElementById('formNo');

  let selectedBranch = null;
  let selectedType = null;

  // Slip number: date-based, human readable
  const now = new Date();
  formNo.textContent = "SLIP NO. " + now.getFullYear().toString().slice(2) +
    String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') +
    "-" + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');

  function setSeg(container, val, cb){
    [...container.querySelectorAll('button')].forEach(b=>{
      b.classList.toggle('active', b.dataset.val === val);
    });
    cb(val);
  }

  branchSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    selectedBranch = btn.dataset.val;
    setSeg(branchSeg, selectedBranch, ()=>{});
    populateEmployees(selectedBranch);
  });

  typeSeg.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    selectedType = btn.dataset.val;
    setSeg(typeSeg, selectedType, ()=>{});
    const isOffset = selectedType === 'Offset Request';
    hoursField.style.display = isOffset ? 'block' : 'none';
    if(!isOffset) hoursEl.value = '';
  });

  function populateEmployees(branch){
    const list = EMPLOYEES[branch] || [];
    employeeSelect.innerHTML = '<option value="">Select employee</option>' +
      list.map(n=>`<option value="${n}">${n}</option>`).join('') +
      '<option value="__other">Other / not listed</option>';
    employeeSelect.style.display = 'block';
    employeeOther.style.display = 'none';
    employeeOther.value = '';
    populateCoverOptions(branch, '');
  }

  function populateCoverOptions(branch, excludeName){
    const list = (EMPLOYEES[branch] || []).filter(n => n !== excludeName);
    coverSelect.innerHTML = '<option value="">Select employee</option>' +
      list.map(n=>`<option value="${n}">${n}</option>`).join('') +
      '<option value="__other">Other / not listed</option>';
    coverSelect.style.display = 'block';
    coverOther.style.display = 'none';
    coverOther.value = '';
  }

  employeeSelect.addEventListener('change', ()=>{
    if(employeeSelect.value === '__other'){
      employeeOther.style.display = 'block';
      employeeOther.focus();
    } else {
      employeeOther.style.display = 'none';
      employeeOther.value = '';
    }
    populateCoverOptions(selectedBranch, employeeSelect.value === '__other' ? '' : employeeSelect.value);
  });

  coverSelect.addEventListener('change', ()=>{
    if(coverSelect.value === '__other'){
      coverOther.style.display = 'block';
      coverOther.focus();
    } else {
      coverOther.style.display = 'none';
      coverOther.value = '';
    }
  });

  function computeDays(){
    if(dateFrom.value && dateTo.value){
      const d1 = new Date(dateFrom.value);
      const d2 = new Date(dateTo.value);
      const diff = Math.round((d2 - d1) / 86400000) + 1;
      if(diff > 0){
        daysNote.textContent = diff + (diff === 1 ? " day" : " days") + " of leave";
      } else {
        daysNote.textContent = '"To" date must be on or after "From" date';
      }
    } else {
      daysNote.textContent = '';
    }
  }
  dateFrom.addEventListener('change', ()=>{
    if(!dateTo.value) dateTo.value = dateFrom.value;
    computeDays();
  });
  dateTo.addEventListener('change', computeDays);

  function showError(msg){
    formError.textContent = msg;
    formError.classList.add('show');
  }
  function clearError(){
    formError.textContent = '';
    formError.classList.remove('show');
  }

  function getEmployeeName(){
    if(employeeSelect.value === '__other') return employeeOther.value.trim();
    return employeeSelect.value;
  }

  function getCoverName(){
    if(coverSelect.value === '__other') return coverOther.value.trim();
    return coverSelect.value;
  }

  async function submitToBackend(blob, fields){
    const form = new FormData();
    form.append('photo', blob, 'leave-slip.png');
    Object.entries(fields).forEach(([k,v]) => form.append(k, v));
    try{
      const resp = await fetch(`${BACKEND_URL}/api/submit-leave`, { method: 'POST', body: form });
      const data = await resp.json();
      return !!data.ok;
    } catch(err){
      return false;
    }
  }

  function loadImage(src){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    const words = text.split(' ');
    let line = '';
    let lines = 0;
    for(let n=0; n<words.length; n++){
      const testLine = line + words[n] + ' ';
      if(ctx.measureText(testLine).width > maxWidth && n > 0){
        ctx.fillText(line, x, y + lines*lineHeight);
        line = words[n] + ' ';
        lines++;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y + lines*lineHeight);
    return lines + 1; // total lines drawn
  }

  async function generateSlipImage(data){
    const canvas = document.getElementById('slipCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const NAVY = '#1B2A4A';
    const PAPER = '#F7F3E8';
    const GREEN = '#12824A';
    const LINE = 'rgba(27,42,74,0.22)';
    const typeColors = { 'Sick':'#B5442E', 'Vacation':'#12824A', 'Emergency/Other':'#C9A227' };
    const typeEmoji = { 'Sick': '🤒', 'Vacation': '🌴', 'Emergency/Other': '⚠️' };

    // Wait for fonts to be ready
    await document.fonts.ready;

    // Background
    ctx.fillStyle = PAPER;
    ctx.fillRect(0,0,W,H);

    // Outer border
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    ctx.strokeRect(24, 24, W-48, H-48);

    const pad = 70;

    // Logo
    try{
      const logoSrc = document.querySelector('.logo').src;
      const logoImg = await loadImage(logoSrc);
      const logoSize = 84;
      ctx.save();
      ctx.beginPath();
      const lx = pad, ly = 66, lr = 18;
      ctx.moveTo(lx+lr, ly);
      ctx.arcTo(lx+logoSize, ly, lx+logoSize, ly+logoSize, lr);
      ctx.arcTo(lx+logoSize, ly+logoSize, lx, ly+logoSize, lr);
      ctx.arcTo(lx, ly+logoSize, lx, ly, lr);
      ctx.arcTo(lx, ly, lx+logoSize, ly, lr);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(logoImg, lx, ly, logoSize, logoSize);
      ctx.restore();
    } catch(e){ /* logo optional */ }

    // Brand name
    ctx.fillStyle = NAVY;
    ctx.font = "700 40px 'Fraunces', serif";
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Psulit', pad + 100, 105);
    const psulitWidth = ctx.measureText('Psulit ').width;
    ctx.fillStyle = GREEN;
    ctx.fillText('Money Changer', pad + 100 + psulitWidth, 105);

    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.55;
    ctx.font = "500 20px 'IBM Plex Mono', monospace";
    ctx.fillText('INTERNAL USE', pad + 100, 138);
    ctx.globalAlpha = 1;

    // divider
    ctx.strokeStyle = NAVY;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(pad, 176);
    ctx.lineTo(W-pad, 176);
    ctx.stroke();

    // Slip no (right aligned)
    ctx.font = "500 20px 'IBM Plex Mono', monospace";
    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.6;
    ctx.textAlign = 'right';
    ctx.fillText(data.slipNo, W - pad, 210);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;

    // Title
    ctx.fillStyle = NAVY;
    ctx.font = "600 54px 'Fraunces', serif";
    ctx.textAlign = 'center';
    ctx.fillText('Leave Request Slip', W/2, 280);
    ctx.font = "500 20px 'IBM Plex Mono', monospace";
    ctx.globalAlpha = 0.6;
    ctx.fillText('SICK · VACATION · EMERGENCY', W/2, 312);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    // Card
    const cardX = pad, cardY = 360, cardW = W - pad*2, cardH = H - cardY - 130;
    ctx.fillStyle = '#fffdf8';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    ctx.fillRect(cardX, cardY, cardW, cardH);
    ctx.strokeRect(cardX, cardY, cardW, cardH);

    let cy = cardY + 70;
    const cx = cardX + 44;
    const labelColor = NAVY;

    function drawLabel(text, y){
      ctx.font = "600 18px 'IBM Plex Mono', monospace";
      ctx.fillStyle = labelColor;
      ctx.globalAlpha = 0.6;
      ctx.fillText(text.toUpperCase(), cx, y);
      ctx.globalAlpha = 1;
    }
    function drawValue(text, y, opts={}){
      ctx.font = (opts.size || "600 32px 'Inter', sans-serif");
      ctx.fillStyle = opts.color || NAVY;
      ctx.fillText(text, cx, y);
    }

    // Leave type badge
    const badgeColor = typeColors[data.type] || GREEN;
    ctx.fillStyle = badgeColor;
    const badgeText = `${typeEmoji[data.type]}  ${data.type} Leave`;
    ctx.font = "700 30px 'Inter', sans-serif";
    const badgeTextW = ctx.measureText(badgeText).width;
    const badgePadX = 26, badgeH = 56;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx, cy-40, badgeTextW+badgePadX*2, badgeH, 8) : ctx.rect(cx, cy-40, badgeTextW+badgePadX*2, badgeH);
    ctx.fill();
    ctx.fillStyle = '#fffdf8';
    ctx.fillText(badgeText, cx+badgePadX, cy-2);
    cy += 70;

    drawLabel('Branch', cy); cy += 40;
    drawValue(data.branch, cy); cy += 60;

    drawLabel('Employee', cy); cy += 40;
    drawValue(data.employee, cy); cy += 60;

    drawLabel('Shift Covered By', cy); cy += 40;
    drawValue(data.coverBy, cy, {size:"600 28px 'Inter', sans-serif"}); cy += 56;

    drawLabel('Dates', cy); cy += 40;
    drawValue(`${data.fromFmt} – ${data.toFmt}`, cy, {size:"600 28px 'Inter', sans-serif"});
    cy += 32;
    ctx.font = "500 20px 'IBM Plex Mono', monospace";
    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.55;
    ctx.fillText(`${data.dayCount} ${data.dayCount===1?'day':'days'} of leave`, cx, cy);
    ctx.globalAlpha = 1;
    cy += 50;

    if(data.hoursRequested){
      drawLabel('Hours Requested', cy); cy += 40;
      drawValue(`${data.hoursRequested} hours`, cy, {size:"600 28px 'Inter', sans-serif"}); cy += 56;
    }

    drawLabel('Reason', cy); cy += 38;
    ctx.font = "500 26px 'Inter', sans-serif";
    ctx.fillStyle = NAVY;
    const reasonLines = wrapText(ctx, data.reason, cx, cy, cardW - 88, 34);
    cy += reasonLines*34 + 30;

    if(data.contact){
      drawLabel('Contact', cy); cy += 38;
      drawValue(data.contact, cy, {size:"500 26px 'Inter', sans-serif"});
      cy += 50;
    }

    // Footer
    ctx.textAlign = 'center';
    ctx.font = "500 18px 'IBM Plex Mono', monospace";
    ctx.fillStyle = NAVY;
    ctx.globalAlpha = 0.5;
    ctx.fillText(`Submitted ${data.submittedAt}`, W/2, H - 82);
    ctx.fillText('Routed to Jen & Psulit Leave Requests and Approvals', W/2, H - 54);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    return new Promise(resolve=>{
      canvas.toBlob(blob=>resolve(blob), 'image/png');
    });
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('leaveForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    clearError();

    const employee = getEmployeeName();
    const coverBy = getCoverName();
    const branch = selectedBranch;
    const type = selectedType;
    const from = dateFrom.value;
    const to = dateTo.value;
    const reason = reasonEl.value.trim();
    const contact = contactEl.value.trim();

    if(!branch) return showError('Select a branch.');
    if(!employee) return showError('Select or enter the employee name.');
    if(!coverBy) return showError('Select who will cover the shift.');
    if(!type) return showError('Select a leave type.');
    if(!from || !to) return showError('Select the leave dates.');
    if(new Date(to) < new Date(from)) return showError('"To" date must be on or after "From" date.');
    if(type === 'Offset Request' && !(Number(hoursEl.value) > 0)) return showError('Enter the number of hours for the offset.');
    if(!reason) return showError('Enter a reason for the leave.');

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    const d1 = new Date(from), d2 = new Date(to);
    const dayCount = Math.round((d2 - d1)/86400000) + 1;

    const fmt = (d)=> new Date(d).toLocaleDateString('en-PH', {month:'short', day:'numeric', year:'numeric'});

    try{
      const blob = await generateSlipImage({
        slipNo: formNo.textContent,
        type, branch, employee, coverBy,
        hoursRequested: type === 'Offset Request' ? hoursEl.value : '',
        fromFmt: fmt(from), toFmt: fmt(to), dayCount,
        reason, contact,
        submittedAt: new Date().toLocaleString('en-PH', {dateStyle:'medium', timeStyle:'short'})
      });
      const ok = await submitToBackend(blob, {
        employee, coverBy, branch, type,
        fromFmt: fmt(from), toFmt: fmt(to), dayCount,
        dateFrom: from, dateTo: to,
        hoursRequested: type === 'Offset Request' ? hoursEl.value : '',
        reason, contact,
        slipNo: formNo.textContent
      });
      showStamp(ok);
      if(ok){
        document.getElementById('leaveForm').reset();
        selectedBranch = null;
        selectedType = null;
        [...branchSeg.querySelectorAll('button')].forEach(b=>b.classList.remove('active'));
        [...typeSeg.querySelectorAll('button')].forEach(b=>b.classList.remove('active'));
        employeeSelect.innerHTML = '<option value="">Select branch first</option>';
        employeeOther.style.display = 'none';
        hoursField.style.display = 'none';
        hoursEl.value = '';
        coverSelect.innerHTML = '<option value="">Select employee first</option>';
        coverOther.style.display = 'none';
        daysNote.textContent = '';
      }
    } catch(err){
      showStamp(false);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Leave Slip';
    }
  });

  function showStamp(ok){
    const wrap = document.getElementById('stampWrap');
    const stamp = document.getElementById('stampEl');
    const msg = document.getElementById('stampMsg');
    stamp.classList.remove('animate','error-stamp');
    void stamp.offsetWidth; // restart animation
    if(ok){
      stamp.textContent = 'SUBMITTED';
      stamp.classList.remove('error-stamp');
      msg.textContent = 'Your leave slip has been sent to Jen and the approvals group.';
    } else {
      stamp.textContent = 'NOT SENT';
      stamp.classList.add('error-stamp');
      msg.textContent = 'Something went wrong sending this to Telegram. Please try again or message Jen directly.';
    }
    stamp.classList.add('animate');
    wrap.classList.add('show');
  }
  document.getElementById('stampClose').addEventListener('click', ()=>{
    document.getElementById('stampWrap').classList.remove('show');
  });
</script>
</body>
</html>
